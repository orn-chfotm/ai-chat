dependencies {
    implementation project(':domain')

    // APP DB ledger persistence + migrations
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // PDF text extraction (infra.document)
    implementation 'org.apache.pdfbox:pdfbox:2.0.30'

    // Vector DB client (infra.vectordb) - matches docker-compose Elasticsearch 8.15.3
    implementation 'co.elastic.clients:elasticsearch-java:8.15.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}
