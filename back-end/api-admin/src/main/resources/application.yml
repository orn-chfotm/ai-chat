spring:
  application:
    name: chat-ai-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chat_ai}
    username: ${DB_USERNAME:chat_ai}
    password: ${DB_PASSWORD:chat_ai}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

app:
  file-storage:
    base-dir: ${FILE_STORAGE_BASE_DIR:./uploads}
  async:
    job-executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 50
  vectordb:
    elasticsearch:
      url: ${ES_URL:http://localhost:9200}
