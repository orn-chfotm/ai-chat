services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-ai-postgres
    environment:
      POSTGRES_DB: chat_ai
      POSTGRES_USER: chat_ai
      POSTGRES_PASSWORD: chat_ai
    ports:
      - "5432:5432"
    volumes:
      - chat-ai-postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: chat-ai-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - chat-ai-elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  chat-ai-postgres-data:
  chat-ai-elasticsearch-data:
